<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f6f1e6" />
    <title>填字</title>
    <link rel="stylesheet" href="./css/app.css?v=5" />
  </head>
  <body>
    <div id="app">
      <header>
        <button id="how-to" type="button" class="icon-btn">?</button>
        <div class="titles">
          <h1>填字</h1>
          <p id="level">第 1 關</p>
        </div>
        <button id="next" type="button" class="text-btn">下一關</button>
      </header>

      <p id="clue" class="clue"></p>
      <div id="grid" class="grid"></div>
    </div>

    <footer class="dock">
      <div id="bank" class="bank-grid"></div>
      <div class="dock-bar">
        <button id="clear" type="button">清空</button>
        <button id="hint" type="button">答案提示</button>
      </div>
    </footer>

    <div id="modal" class="modal hide">
      <div class="sheet">
        <p data-modal-title class="sheet-title"></p>
        <p data-modal-body class="sheet-body"></p>
        <button id="play-again" type="button" class="sheet-ok">下一題</button>
      </div>
    </div>

    <script type="module" src="./js/app.js?v=5"></script>
  </body>
</html>
