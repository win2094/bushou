<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#f4efe4" />
    <title>結字 — 漢字 Knotwords</title>
    <link rel="stylesheet" href="./css/app.css?v=4" />
  </head>
  <body>
    <div id="app">
      <header>
        <button id="how-to" type="button" class="icon-btn">?</button>
        <div class="titles">
          <h1>結字</h1>
          <p id="meta">漢字 Knotwords</p>
        </div>
        <button id="new-game" type="button" class="text-btn">換題</button>
      </header>

      <p id="tip" class="tip"></p>
      <div id="col-banks" class="col-banks"></div>
      <div id="board" class="board"></div>
      <button id="hint" type="button" class="text-btn hint-btn">提示一格</button>
    </div>

    <section id="tray" class="tray"></section>

    <div id="modal" class="modal hide">
      <div class="sheet">
        <p data-modal-title class="sheet-title"></p>
        <p data-modal-reveal class="sheet-reveal"></p>
        <p data-modal-body class="sheet-body"></p>
        <button id="play-again" type="button" class="sheet-ok">好</button>
      </div>
    </div>

    <script type="module" src="./js/app.js?v=4"></script>
  </body>
</html>
